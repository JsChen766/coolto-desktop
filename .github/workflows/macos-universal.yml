name: Build macOS Universal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Build hardened Universal package
        run: npm run package:mac:dmg

      - name: Verify Universal architectures and ad-hoc signature
        shell: bash
        run: |
          app="dist-electron/mac-universal/Coolto.app"
          main_archs="$(lipo -archs "$app/Contents/MacOS/Coolto")"
          native_archs="$(lipo -archs "$app/Contents/Resources/native/coolto-core.node")"
          [[ "$main_archs" == *arm64* && "$main_archs" == *x86_64* ]]
          [[ "$native_archs" == *arm64* && "$native_archs" == *x86_64* ]]
          codesign --verify --deep --strict "$app"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coolto-macos-universal
          path: |
            dist-electron/*.dmg
            dist-electron/*.dmg.blockmap
            dist-electron/*.zip
            dist-electron/*.zip.blockmap
            dist-electron/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
