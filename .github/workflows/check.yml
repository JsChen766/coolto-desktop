name: Check

# Runs the full `npm run check` gate on both shipping desktop platforms for every
# pull request and every push to main. Needs no secrets, so fork PRs work as-is.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # `npm run check` type-checks, unit-tests and bundles; it never launches
      # Electron, so skip the ~100 MB Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run project checks
        run: npm run check
