name: Build Windows Release

# OSS: 仅手动 workflow_dispatch。不配置 RELEASE_SERVER_* 则上传步骤跳过，不会因缺 secrets 变红。
# 商业/维护者可选：在仓库 Settings → Secrets 配置后再手动 Run；勿把这些 secrets 标为必填。
# 产物：dist-electron/Coolto-<version>-x64.exe + latest.yml + .blockmap
on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    # if: 不能引用 secrets（workflow 文件会非法，每次 push 都红）。
    # 只暴露是否已配置；密钥仍只在上传步骤注入。
    env:
      RELEASE_SERVER_CONFIGURED: "${{ secrets.RELEASE_SERVER_SSH_KEY != '' && secrets.RELEASE_SERVER_HOST != '' && secrets.RELEASE_SERVER_USER != '' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build native core (win-x64)
        run: npm run native:build:win

      - name: Build protected desktop bundle
        run: npm run desktop:build:protected

      - name: Package Windows app (NSIS)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify release hardening
        run: node scripts/verify-release-hardening.mjs dist-electron/win-unpacked

      - name: Verify installer (real install + bootstrap + uninstall)
        run: node scripts/verify-windows-installer.mjs

      - name: Upload artifacts to release server
        if: ${{ env.RELEASE_SERVER_CONFIGURED == 'true' }}
        shell: bash
        env:
          SSH_KEY: ${{ secrets.RELEASE_SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.RELEASE_SERVER_HOST }}
          SERVER_USER: ${{ secrets.RELEASE_SERVER_USER }}
        run: |
          set -euo pipefail
          ls -la dist-electron/ | grep -E "exe|yml|blockmap"
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_ci
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/release_ci \
            dist-electron/latest.yml dist-electron/Coolto-*.exe dist-electron/Coolto-*.exe.blockmap \
            "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/"
          # Pull the mac feed so the download page lists both platforms.
          scp -i ~/.ssh/release_ci \
            "$SERVER_USER@$SERVER_HOST:/srv/coolto-releases/latest-mac.yml" dist-electron/ || true
          node scripts/generate-download-page.mjs
          scp -i ~/.ssh/release_ci dist-electron/index.html \
            "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/upload-index.html"
          ssh -i ~/.ssh/release_ci "$SERVER_USER@$SERVER_HOST" \
            "sudo install -o root -g root -m 644 /home/$SERVER_USER/latest.yml /home/$SERVER_USER/Coolto-*.exe /home/$SERVER_USER/Coolto-*.exe.blockmap /srv/coolto-releases/ && sudo install -o root -g root -m 644 /home/$SERVER_USER/upload-index.html /srv/coolto-releases/index.html && rm -f /home/$SERVER_USER/latest.yml /home/$SERVER_USER/Coolto-*.exe /home/$SERVER_USER/Coolto-*.exe.blockmap /home/$SERVER_USER/upload-index.html && ls -la /srv/coolto-releases/"

      - name: Skip upload when RELEASE_SERVER_* unset
        if: ${{ env.RELEASE_SERVER_CONFIGURED != 'true' }}
        shell: bash
        run: echo "RELEASE_SERVER_* not configured — packaging done; upload skipped (OSS default)."
