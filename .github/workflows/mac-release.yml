name: Build macOS Release

# OSS: 仅手动 workflow_dispatch。不配置 RELEASE_SERVER_* 则上传步骤跳过，不会因缺 secrets 变红。
# 商业/维护者可选：在仓库 Settings → Secrets 配置后再手动 Run；勿把这些 secrets 标为必填。
# 产物：Coolto-<version>-x64.dmg / -arm64.dmg、Coolto-*-mac.zip + latest-mac.yml
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      # electron-builder's universal merge cannot combine third-party
      # per-arch napi packages (canvas via pdfjs, keyring) into one .app, so
      # we ship separate x64/arm64 zips and let electron-updater pick by arch.
      # The runner is arm64, so npm ci only installed arm64 optional packages;
      # install the x64 ones alongside so the x64 build contains them.
      - name: Install x64 optional native packages
        run: npm install --no-save --force @napi-rs/canvas-darwin-x64@1.0.2 @napi-rs/keyring-darwin-x64@1.3.0

      - name: Build native core (universal)
        run: npm run native:build:mac

      - name: Build protected desktop bundle
        run: npm run desktop:build:protected

      - name: Package macOS app (x64 + arm64 zips)
        run: npx electron-builder --mac zip dmg --x64 --arm64 --publish never

      - name: Verify release hardening (all archs)
        run: |
          for app in $(find dist-electron -maxdepth 2 -name "Coolto.app" -type d); do
            echo "verifying $app"
            node scripts/verify-release-hardening.mjs "$app"
          done

      - name: Upload artifacts to release server
        if: ${{ secrets.RELEASE_SERVER_SSH_KEY != '' && secrets.RELEASE_SERVER_HOST != '' && secrets.RELEASE_SERVER_USER != '' }}
        env:
          SSH_KEY: ${{ secrets.RELEASE_SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.RELEASE_SERVER_HOST }}
          SERVER_USER: ${{ secrets.RELEASE_SERVER_USER }}
        run: |
          set -euo pipefail
          ls -la dist-electron/ | grep -E "zip|dmg|yml"
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_ci
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/release_ci \
            dist-electron/*.zip dist-electron/*.dmg dist-electron/latest-mac.yml \
            "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/"
          ssh -i ~/.ssh/release_ci "$SERVER_USER@$SERVER_HOST" \
            "sudo install -o root -g root -m 644 /home/$SERVER_USER/Coolto-*.zip /home/$SERVER_USER/Coolto-*.dmg /home/$SERVER_USER/latest-mac.yml /srv/coolto-releases/ && rm -f /home/$SERVER_USER/Coolto-*.zip /home/$SERVER_USER/Coolto-*.dmg /home/$SERVER_USER/latest-mac.yml && ls -la /srv/coolto-releases/"
          # Regenerate the download page so the mac buttons stay current even
          # when this workflow runs without a Windows release.
          scp -i ~/.ssh/release_ci \
            "$SERVER_USER@$SERVER_HOST:/srv/coolto-releases/latest.yml" dist-electron/ || true
          node scripts/generate-download-page.mjs
          scp -i ~/.ssh/release_ci dist-electron/index.html \
            "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/upload-index.html"
          ssh -i ~/.ssh/release_ci "$SERVER_USER@$SERVER_HOST" \
            "sudo install -o root -g root -m 644 /home/$SERVER_USER/upload-index.html /srv/coolto-releases/index.html && rm -f /home/$SERVER_USER/upload-index.html"

      - name: Skip upload when RELEASE_SERVER_* unset
        if: ${{ secrets.RELEASE_SERVER_SSH_KEY == '' || secrets.RELEASE_SERVER_HOST == '' || secrets.RELEASE_SERVER_USER == '' }}
        run: echo "RELEASE_SERVER_* not configured — packaging done; upload skipped (OSS default)."
