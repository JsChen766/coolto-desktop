name: Deploy Homepage

# OSS: 仅手动 workflow_dispatch（商业官网部署，开源 fork 无需配置）。
# 不配置 RELEASE_SERVER_* 则部署步骤跳过，不会因缺 secrets 变红；勿标为必填 secrets。
# 版本号默认从服务器 feed（latest.yml / latest-mac.yml）读取；可用 release-version 覆盖。
# 产物：vite build → dist/ → 备份服务器旧版 → 替换 website-dist。
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: "覆盖下载链接版本（默认读取服务器 feed 最新版）"
        required: false
        type: string

jobs:
  check-release-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check RELEASE_SERVER_* secrets
        id: check
        env:
          # if: 不能引用 secrets。这里只得到 true/false，不把密钥放进环境。
          RELEASE_SERVER_CONFIGURED: "${{ secrets.RELEASE_SERVER_SSH_KEY != '' && secrets.RELEASE_SERVER_HOST != '' && secrets.RELEASE_SERVER_USER != '' }}"
        run: |
          if [ "${RELEASE_SERVER_CONFIGURED}" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_SERVER_* configured — homepage deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_SERVER_* not configured — homepage deploy skipped (OSS default)."
          fi

  deploy-homepage:
    needs: check-release-server
    # OSS fork 未配置 RELEASE_SERVER_* 时整 job 跳过（绿），避免缺 HomePage-Web / secrets 变红。
    # job if 不能读 secrets 或 env，所以用上面的输出。
    if: ${{ needs.check-release-server.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (HomePage-Web)
        uses: actions/checkout@v4
        with:
          ref: HomePage-Web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: homepage-web
        run: pnpm install --frozen-lockfile

      - name: Resolve release version from server feed
        id: version
        env:
          SSH_KEY: ${{ secrets.RELEASE_SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.RELEASE_SERVER_HOST }}
          SERVER_USER: ${{ secrets.RELEASE_SERVER_USER }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release-version }}" ]; then
            echo "version=${{ inputs.release-version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ]; then
            echo "RELEASE_SERVER_* unset and no release-version input — skipping homepage deploy path."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_ci
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/release_ci "$SERVER_USER@$SERVER_HOST" \
            "awk '/^version:/{print \$2; exit}' /srv/coolto-releases/latest.yml" > version.txt
          cat version.txt
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build homepage
        if: ${{ steps.version.outputs.version != '' }}
        working-directory: homepage-web
        env:
          VITE_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: Verify download URLs in bundle
        if: ${{ steps.version.outputs.version != '' }}
        working-directory: homepage-web
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # URLs are template-concatenated in the bundle, so verify the
          # injected version literal and the per-platform file-name fragments.
          grep -q "${VERSION}" dist/assets/*.js
          grep -q "arm64.dmg" dist/assets/*.js
          grep -q "x64.dmg" dist/assets/*.js
          grep -q "x64.exe" dist/assets/*.js
          echo "bundle references version ${VERSION}"

      - name: Deploy to release server
        if: ${{ steps.version.outputs.version != '' }}
        env:
          SSH_KEY: ${{ secrets.RELEASE_SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.RELEASE_SERVER_HOST }}
          SERVER_USER: ${{ secrets.RELEASE_SERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_ci
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cd homepage-web
          tar -czf /tmp/homepage-dist.tar.gz dist
          scp -i ~/.ssh/release_ci /tmp/homepage-dist.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/homepage-dist.tar.gz"
          ssh -i ~/.ssh/release_ci "$SERVER_USER@$SERVER_HOST" bash -c '
            set -euo pipefail
            BACKUP=/home/ubuntu/cv-agent-app-be/website-dist.bak-ci-$(date +%Y%m%d-%H%M%S)
            sudo cp -r /home/ubuntu/cv-agent-app-be/website-dist "$BACKUP"
            sudo rm -rf /tmp/homepage-dist && sudo mkdir -p /tmp/homepage-dist
            sudo tar -xzf /home/ubuntu/homepage-dist.tar.gz -C /tmp/homepage-dist --strip-components=1
            sudo rm -rf /home/ubuntu/cv-agent-app-be/website-dist/*
            sudo cp -r /tmp/homepage-dist/* /home/ubuntu/cv-agent-app-be/website-dist/
            sudo chown -R ubuntu:ubuntu /home/ubuntu/cv-agent-app-be/website-dist
            sudo rm -rf /tmp/homepage-dist /home/ubuntu/homepage-dist.tar.gz
            echo "backup: $BACKUP"
          '
          # smoke: title should be the product name now
          ssh -i ~/.ssh/release_ci "$SERVER_USER@$SERVER_HOST" \
            "curl -sk https://home.coolto.com.cn/ | grep -q '<title>Coolto' && echo 'title ok'"

      - name: Skip deploy when RELEASE_SERVER_* unset
        if: ${{ steps.version.outputs.version == '' }}
        run: echo "RELEASE_SERVER_* / release-version not available — homepage deploy skipped (OSS default)."

