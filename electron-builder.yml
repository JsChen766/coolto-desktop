appId: com.coolto.app
productName: Coolto
directories:
  output: dist-electron
  buildResources: build
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The packaged renderer still uses loadFile(). Keep this enabled until the
  # app migrates to a privileged custom protocol.
  grantFileProtocolExtraPrivileges: true
files:
  - out/**/*
  - node_modules/**/*
  - package.json
publish:
  provider: generic
  url: http://127.0.0.1:8099
mac:
  category: public.app-category.productivity
  identity: "-"
  extraResources:
    - from: native/coolto-core/artifacts/coolto-core.darwin-universal.node
      to: native/coolto-core.node
  target:
    - target: dir
      arch:
        - universal
    - target: zip
      arch:
        - universal
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
win:
  extraResources:
    - from: native/coolto-core/artifacts/coolto-core.win32-x64-msvc.node
      to: native/coolto-core.node
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
