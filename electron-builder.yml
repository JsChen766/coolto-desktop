appId: com.coolto.app
productName: Coolto
directories:
  output: dist-electron
  buildResources: build
files:
  - out/**/*
  - node_modules/**/*
  - package.json
mac:
  category: public.app-category.productivity
  identity: "-"
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
