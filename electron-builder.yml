appId: com.coolto.app
productName: Coolto
directories:
  output: dist-electron
  buildResources: build
asar: true
# pdf.js 在 Node 环境需要 @napi-rs/canvas 提供 DOMMatrix 等 DOM 类型；
# 原生 .node 必须从 asar 提出，否则打包产物解析 PDF 直接崩溃。
asarUnpack:
  - "node_modules/@napi-rs/canvas/**/*"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The packaged renderer still uses loadFile(). Keep this enabled until the
  # app migrates to a privileged custom protocol.
  grantFileProtocolExtraPrivileges: true
files:
  - out/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: build/material-ocr
    to: material-ocr
  - from: out/main/material-ocr-worker.cjs
    to: material-ocr-worker.cjs
publish:
  provider: generic
  url: https://home.coolto.com.cn/downloads/
protocols:
  - name: Coolto
    schemes:
      - coolto
mac:
  category: public.app-category.productivity
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCalendarsUsageDescription: Coolto 仅在你确认后将面试写入系统日历。
    NSCalendarsWriteOnlyAccessUsageDescription: Coolto 需要添加你确认的面试事件，不读取现有日历内容。
    NSCalendarsFullAccessUsageDescription: 仅在改期或取消已关联事件时，Coolto 需要读取并更新该事件。
  # osx-sign would otherwise ad-hoc sign coolto-core.node, changing its bytes
  # and breaking the SHA-256 check embedded in the protected-main loader.
  # disable-library-validation entitlement allows the unsigned module to load.
  signIgnore:
    - "coolto-core\\.node$"
  extraResources:
    - from: native/coolto-core/artifacts/coolto-core.darwin-universal.node
      to: native/coolto-core.node
  target:
    - target: dir
      arch:
        - universal
    - target: zip
      arch:
        - universal
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
win:
  extraResources:
    - from: native/coolto-core/artifacts/coolto-core.win32-x64-msvc.node
      to: native/coolto-core.node
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 向导式安装：允许用户选择安装目录（oneClick 默认无目录选择页）。
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
