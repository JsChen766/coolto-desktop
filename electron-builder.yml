appId: com.coolto.app
productName: Coolto
directories:
  output: dist-electron
  buildResources: build
files:
  - out/**/*
  - node_modules/**/*
  - package.json
publish:
  provider: generic
  url: http://127.0.0.1:8099
mac:
  category: public.app-category.productivity
  identity: "-"
  target:
    - target: dir
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
